<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ClubRoom</title>
        <script type="importmap">
        {
        "imports": {
            "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
            "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
            "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
            "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
            "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
        }
        }
        </script>
        <script src="index.js" type="module"></script>
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-icons.css">
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="app">Loading...</div>
        <template id="template">
            <div v-if="!$graffitiSession.value" class="login-screen">
                <div class="login-card">
                    <div class="login-icon"><i class="fa-regular fa-comment-dots"></i></div>
                    <h1 class="login-title">ClubRoom</h1>
                    <p class="login-subtitle">Find your club and join the conversation!</p>
                    <button class="btn-login" @click="$graffiti.login()">Log In</button>
                </div>
            </div>

            <div v-else class="app-layout">
                <aside class="sidebar">
                    <div class="sidebar-top">
                        <router-link to="/" class="sidebar-logo">ClubRoom</router-link>
                        <button class="btn-logout" @click="confirmLogout">Log Out</button>
                    </div>

                    <div class="sidebar-tabs">
                        <button :class="{ active: sidebarTab === 'chats' }" @click="sidebarTab = 'chats'">Chats</button>
                        <button :class="{ active: sidebarTab === 'calendar' }" @click="sidebarTab = 'calendar'">Date</button>
                        <button :class="{ active: sidebarTab === 'saved' }" @click="sidebarTab = 'saved'">Saved</button>
                    </div>

                    <div class="sidebar-tab-content">
                        <!-- CHATS TAB -->
                        <div v-if="sidebarTab === 'chats'" class="sidebar-panel">
                            <div class="search-bar">
                                <span class="search-icon"><i class="fa fa-search search-icon"></i></span>
                                <input type="text" v-model="clubSearch" placeholder="Search your clubs" />
                            </div>
                            <div class="bottom-actions">
                                <router-link to="/explore" class="btn-bottom-action explore">
                                    <i class="fa fa-compass"></i> Explore
                                </router-link>
                                <router-link to="/create" class="btn-bottom-action">
                                    <i class="fa fa-plus"></i> Create
                                </router-link>
                            </div>
                            <div class="club-grid">
                                <router-link
                                    v-for="club of filteredJoinedClubs"
                                    :key="club.channel"
                                    :to="`/club/${club.channel}`"
                                    class="club-card"
                                    :class="{ active: $route.params.clubId === club.channel }"
                                >
                                    <div class="club-card-icon">
                                        <graffiti-get-media
                                            v-if="club.icon"
                                            :url="club.icon"
                                            :accept="{ types: ['image/*'] }"
                                            v-slot="{ media }"
                                        >
                                            <img v-if="media" :src="media.dataUrl" class="club-card-img" />
                                            <span v-else><i class="fa-regular fa-comment" style="color:#9ca3af"></i></span>
                                        </graffiti-get-media>
                                        <span v-else><i class="fa-regular fa-comment" style="color:#9ca3af"></i></span>
                                    </div>
                                    <div style="display:flex; flex-direction:column; min-width:0; flex:1; gap:2px;">
                                        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
                                            <span class="club-card-name">{{ club.title }}</span>
                                            <span style="font-size:0.72rem; color:#9ca3af; flex-shrink:0;">
                                                {{ latestMessageByChannel.get(club.channel)?.published
                                                    ? new Date(latestMessageByChannel.get(club.channel).published).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                                                    : '' }}
                                            </span>
                                        </div>
                                        <div class="club-card-preview">{{ latestMessageByChannel.get(club.channel)?.content || '' }}</div>
                                    </div>
                                </router-link>
                                <div v-if="filteredJoinedClubs.length === 0" class="club-grid-empty">
                                    No clubs yet.
                                </div>
                            </div>
                        </div>

                        <!-- CALENDAR TAB -->
                        <div v-if="sidebarTab === 'calendar'" class="sidebar-panel">
                            <div class="calendar-section">
                                <div class="cal-header">
                                    <button @click="calendarOffset--">&#8249;</button>
                                    <div class="cal-header-center">
                                        <select v-model="calendarMonthSelect" class="cal-select">
                                            <option v-for="(m, i) in calendarMonths" :key="i" :value="i">{{ m }}</option>
                                        </select>
                                        <select v-model="calendarYearSelect" class="cal-select">
                                            <option v-for="y in calendarYears" :key="y" :value="y">{{ y }}</option>
                                        </select>
                                    </div>
                                    <button @click="calendarOffset++">&#8250;</button>
                                </div>
                                <div class="cal-grid">
                                    <span v-for="d in ['SUN','MON','TUE','WED','THU','FRI','SAT']" class="cal-dow">{{ d }}</span>
                                    <span v-for="blank in calendarBlanks" class="cal-blank"></span>
                                    <span v-for="day in calendarDays" class="cal-day" :class="{ today: day === todayDate && calendarOffset === 0 }">{{ day }}</span>
                                </div>
                            </div>
                        </div>

                        <!-- SAVED TAB -->
                        <div v-if="sidebarTab === 'saved'" class="sidebar-panel">
                            <div class="saved-panel">
                                <div v-if="savedShowSort || savedShowFilter" class="popup-overlay" @click="savedShowSort = false; savedShowFilter = false"></div>
                                <div class="explore-toolbar" style="padding: 4px 0 2px; flex-shrink:0;">
                                    <div class="toolbar-btn-wrap">
                                        <button class="toolbar-btn" :class="{ active: savedFilterBy !== 'all' }" @click.stop="savedShowFilter = !savedShowFilter; savedShowSort = false">
                                            <span class="toolbar-icon">&#9776;</span> {{ savedFilterLabel }}
                                        </button>
                                        <Transition name="dropdown">
                                            <div v-if="savedShowFilter" class="toolbar-dropdown" @click.stop>
                                                <p class="dropdown-section">Filter by club</p>
                                                <button :class="{ checked: savedFilterBy === 'all' }" @click="savedFilterBy = 'all'; savedShowFilter = false">
                                                    <span class="check">{{ savedFilterBy === 'all' ? '✓' : '' }}</span> All clubs
                                                </button>
                                                <button v-for="club in savedClubOptions" :key="club" :class="{ checked: savedFilterBy === club }" @click="savedFilterBy = club; savedShowFilter = false">
                                                    <span class="check">{{ savedFilterBy === club ? '✓' : '' }}</span> {{ club }}
                                                </button>
                                            </div>
                                        </Transition>
                                    </div>
                                    <div class="toolbar-btn-wrap">
                                        <button class="toolbar-btn" @click.stop="savedShowSort = !savedShowSort; savedShowFilter = false">
                                            Sort {{ savedSortDir === 'asc' ? '↑' : '↓' }}
                                        </button>
                                        <Transition name="dropdown">
                                            <div v-if="savedShowSort" class="toolbar-dropdown" @click.stop>
                                                <p class="dropdown-section">Sort by</p>
                                                <button :class="{ checked: savedSortField === 'date' }" @click="savedSortField = 'date'">
                                                    <span class="check">{{ savedSortField === 'date' ? '✓' : '' }}</span> Date saved
                                                </button>
                                                <button :class="{ checked: savedSortField === 'club' }" @click="savedSortField = 'club'">
                                                    <span class="check">{{ savedSortField === 'club' ? '✓' : '' }}</span> Club name
                                                </button>
                                                <div class="dropdown-divider"></div>
                                                <p class="dropdown-section">Direction</p>
                                                <button :class="{ checked: savedSortDir === 'asc' }" @click="savedSortDir = 'asc'">
                                                    <span class="check">{{ savedSortDir === 'asc' ? '✓' : '' }}</span>
                                                    {{ savedSortField === 'club' ? 'A to Z' : 'Oldest first' }}
                                                </button>
                                                <button :class="{ checked: savedSortDir === 'desc' }" @click="savedSortDir = 'desc'">
                                                    <span class="check">{{ savedSortDir === 'desc' ? '✓' : '' }}</span>
                                                    {{ savedSortField === 'club' ? 'Z to A' : 'Newest first' }}
                                                </button>
                                            </div>
                                        </Transition>
                                    </div>
                                </div>
                                <div class="saved-scroll">
                                    <ul>
                                        <li v-for="item of processedSavedItems" :key="item.url" class="saved-item">
                                            <div class="saved-item-icon">
                                                <graffiti-get-media
                                                    v-if="item.clubIcon"
                                                    :url="item.clubIcon"
                                                    :accept="{ types: ['image/*'] }"
                                                    v-slot="{ media }"
                                                >
                                                    <img v-if="media" :src="media.dataUrl" class="saved-icon-img" />
                                                    <span v-else><i class="fa-regular fa-comment" style="color:#9ca3af"></i></span>
                                                </graffiti-get-media>
                                                <span v-else><i class="fa-regular fa-comment" style="color:#9ca3af"></i></span>
                                            </div>
                                            <div class="saved-item-body">
                                                <span class="saved-meta">{{ (item.value.clubTitle || '').length > 35 ? item.value.clubTitle.slice(0, 35) + '…' : item.value.clubTitle }}</span>
                                                <router-link :to="`/club/${item.value.clubId}`" class="saved-content">{{ item.value.content }}</router-link>
                                            </div>
                                            <button class="btn-remove" @click="unsaveItem(item)">✕</button>
                                        </li>
                                        <li v-if="processedSavedItems.length === 0" class="saved-empty">No saved messages yet.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>

                <main class="main-pane">
                    <router-view></router-view>
                </main>
            </div>
        </template>
    </body>
</html>
