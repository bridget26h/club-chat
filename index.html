<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ClubRoom</title>
        <script type="importmap">
        {
        "imports": {
            "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
            "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
            "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
            "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
            "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
        }
        }
        </script>
        <script src="index.js" type="module"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="app">Loading...</div>
        <template id="template">
            <div v-if="!$graffitiSession.value" class="login-screen">
                <h1>ClubRoom</h1>
                <button class="btn-primary" @click="$graffiti.login()">Log In</button>
            </div>

            <div v-else class="app-layout">
                <aside class="sidebar">

                    <div class="sidebar-top">
                        <span class="sidebar-logo">ClubRoom</span>
                        <button class="btn-logout" @click="$graffiti.logout($graffitiSession.value)">Log Out</button>
                    </div>

                    <div class="search-bar">
                        <span class="search-icon">&#9906;</span>
                        <input type="text" v-model="clubSearch" placeholder="Search your clubs" />
                    </div>

                    <router-link to="/explore" class="explore-link">Explore all clubs</router-link>

                    <div class="club-grid">
                        <router-link
                            v-for="club of filteredJoinedClubs"
                            :key="club.channel"
                            :to="`/club/${club.channel}`"
                            class="club-card"
                            :class="{ active: $route.params.clubId === club.channel }"
                        >
                            <div class="club-card-icon">&#128172;</div>
                            <div class="club-card-name">{{ club.title }}</div>
                            <div class="club-card-preview">{{ club.lastMessage || '' }}</div>
                        </router-link>
                        <div v-if="filteredJoinedClubs.length === 0" class="club-grid-empty">
                            No clubs yet.
                        </div>
                    </div>

                    <form class="create-club-form" @submit.prevent="createClub">
                        <input type="text" v-model="newClubName" placeholder="New club name" />
                        <button type="submit" class="btn-primary small" :disabled="!newClubName || isCreating">
                            {{ isCreating ? '...' : 'Create' }}
                        </button>
                    </form>

                    <div class="sidebar-tabs">
                        <button :class="{ active: sidebarTab === 'calendar' }" @click="sidebarTab = 'calendar'">Date</button>
                        <button :class="{ active: sidebarTab === 'saved' }" @click="sidebarTab = 'saved'">Saved</button>
                    </div>

                    <div v-if="sidebarTab === 'calendar'" class="calendar-section">
                        <div class="cal-header">
                            <button @click="calendarOffset--">&#8249;</button>
                            <span>{{ calendarMonthLabel }}</span>
                            <button @click="calendarOffset++">&#8250;</button>
                        </div>
                        <div class="cal-grid">
                            <span v-for="d in ['SUN','MON','TUE','WED','THU','FRI','SAT']" class="cal-dow">{{ d }}</span>
                            <span v-for="blank in calendarBlanks" class="cal-blank"></span>
                            <span v-for="day in calendarDays" class="cal-day" :class="{ today: day === todayDate && calendarOffset === 0 }">{{ day }}</span>
                        </div>
                    </div>

                    <div v-if="sidebarTab === 'saved'" class="saved-panel">
                        <p class="saved-title">Saved Items</p>
                        <ul>
                            <li v-for="item of savedItems" :key="item.url" class="saved-item">
                                <div class="saved-item-icon">&#128279;</div>
                                <div class="saved-item-body">
                                    <router-link :to="`/club/${item.value.clubId}`" class="saved-content">{{ item.value.content }}</router-link>
                                    <span class="saved-meta">From {{ item.value.clubTitle }}</span>
                                </div>
                                <button class="btn-remove" @click="unsaveItem(item)">✕</button>
                            </li>
                            <li v-if="savedItems.length === 0" class="saved-empty">No saved messages yet.</li>
                        </ul>
                    </div>
                </aside>

                <main class="main-pane">
                    <router-view></router-view>
                </main>
            </div>
        </template>
    </body>
</html>
