<h2>Explore Clubs</h2>

<input type="text" v-model="searchQuery" placeholder="Search clubs..." />

<ul>
    <li v-for="club of filteredAllClubs" :key="club.url">
        {{ club.value.title }}
        <button v-if="!joinedChannels.has(club.value.channel)" @click="joinClub(club)">Join</button>
        <span v-else>(joined)</span>
    </li>
    <li v-if="filteredAllClubs.length === 0 && searchQuery">No clubs found.</li>
    <li v-if="!searchQuery && filteredAllClubs.length === 0">No clubs exist yet.</li>
</ul>
