<div class="create-page">
    <h2>Create a Club</h2>
    <div class="create-form">
        <div class="form-group">
            <label>Club Name <span class="required">*</span></label>
            <input type="text" v-model="newClubName" placeholder="e.g. Rocket Team" maxlength="35" />
            <span v-if="newClubName.length >= 35" class="char-warning">⚠ 35 maximum character limit reached</span>
            <span v-else-if="newClubName.length >= 25" class="char-warning">{{ 35 - newClubName.length }} characters remaining</span>
        </div>

        <div class="form-group">
            <label>Description <span class="required">*</span></label>
            <textarea v-model="newClubDescription" placeholder="What's this club about?" rows="3" maxlength="120"></textarea>
            <span v-if="newClubDescription.length >= 120" class="char-warning">⚠ 120 maximum character limit reached</span>
            <span v-else-if="newClubDescription.length >= 100" class="char-warning">{{ 120 - newClubDescription.length }} characters remaining</span>
        </div>

        <div class="form-group">
            <label>Club Profile Picture</label>
            <input type="file" accept="image/*" @change="handleFileSelect" />
            <div v-if="previewUrl" class="icon-preview">
            <img :src="previewUrl" alt="preview" />
            </div>
        </div>

        <div class="form-actions">
            <router-link to="/" class="btn-secondary">Cancel</router-link>
            <button
            class="btn-primary"
            @click="createClub"
            :disabled="!newClubName || !newClubDescription || isCreating"
            >
            {{ isCreating ? 'Creating...' : 'Create Club' }}
            </button>
        </div>
    </div>
</div>
