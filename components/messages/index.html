<div class="message-row" :class="{ mine: isOwner }"
    @mouseenter="showActions = true"
    @mouseleave="onMouseLeave"
    @touchstart.passive="onTouchStart"
    @touchend="onTouchEnd"
    @touchcancel="onTouchEnd">

    <div v-if="!isOwner" class="message-with-avatar">
        <div class="avatar">
            <graffiti-actor-to-handle :actor="actor" v-slot="{ handle }">
                <span>{{ (handle || '?')[0].toUpperCase() }}</span>
            </graffiti-actor-to-handle>
        </div>
        <div class="message-body">
            <div class="message-sender">
                <graffiti-actor-to-handle :actor="actor" v-slot="{ handle }">
                    {{ (handle || '').replace('.graffiti.actor', '') }}
                </graffiti-actor-to-handle>
            </div>
            <div class="bubble-wrap">
                <div class="bubble" :class="{ pressing: isPressing }">{{ content }}</div>
                <Transition name="check-fade">
                    <div v-if="showActions" class="msg-action-btns" @mouseenter="onActionsEnter">
                        <div class="msg-menu-wrap">
                            <button class="msg-icon-btn" @click.stop="toggleReactions" title="React">
                                <i class="fa-regular fa-face-smile"></i>
                            </button>
                            <Transition name="dropdown">
                                <div v-if="showReactions" class="reaction-bar" :class="{ 'above': reactionsAbove, 'reaction-bar-right': isOwner }" @click.stop>
                                    <button class="reaction-btn" @click.stop="doReact('❤️')">❤️</button>
                                    <button class="reaction-btn" @click.stop="doReact('😆')">😆</button>
                                    <button class="reaction-btn" @click.stop="doReact('😮')">😮</button>
                                    <button class="reaction-btn" @click.stop="doReact('😢')">😢</button>
                                    <button class="reaction-btn" @click.stop="doReact('😡')">😡</button>
                                    <button class="reaction-btn" @click.stop="doReact('👍')">👍</button>
                                </div>
                            </Transition>
                        </div>
                        <button class="msg-icon-btn" @click.stop="doReply" title="Reply">
                            <i class="fa fa-reply"></i>
                        </button>
                        <div class="msg-menu-wrap">
                            <button class="msg-icon-btn" @click.stop="toggleMenu" title="More">
                                <i class="fa fa-ellipsis-v"></i>
                            </button>
                            <Transition name="dropdown">
                                <div v-if="menuOpen" class="msg-menu" :class="{ above: menuAbove }" @click.stop>
                                    <button @click="doSave">
                                        <i class="fa fa-bookmark"></i>
                                        {{ saved ? 'Unsave' : 'Save' }}
                                    </button>
                                </div>
                            </Transition>
                        </div>
                    </div>
                </Transition>
            </div>
            <div v-if="groupedReactions.length > 0" class="reaction-display">
                <button v-for="r in groupedReactions" :key="r.emoji"
                    class="reaction-pill" :class="{ mine: r.mine }"
                    @click.stop="openReactionPopup(r.emoji, $event)">
                    {{ r.emoji }} {{ r.count }}
                </button>
            </div>
            <span v-if="isEdited" class="edited-label">edited</span>
        </div>
    </div>

    <template v-else>
        <div class="message-body" style="align-items:flex-end">
            <template v-if="isEditing">
                <textarea class="edit-input" v-model="editContent" rows="2"></textarea>
                <div class="edit-actions">
                    <button class="btn-action" @click="cancelEdit">Cancel</button>
                    <button class="btn-action" @click="submitEdit">Save</button>
                </div>
            </template>
            <template v-else>
                <div class="bubble-wrap">
                    <Transition name="check-fade">
                        <div v-if="showActions" class="msg-action-btns" @mouseenter="onActionsEnter">
                            <div class="msg-menu-wrap">
                                <button class="msg-icon-btn" @click.stop="toggleMenu" title="More">
                                    <i class="fa fa-ellipsis-v"></i>
                                </button>
                                <Transition name="dropdown">
                                    <div v-if="menuOpen" class="msg-menu" :class="{ above: menuAbove, 'msg-menu-left': true }" @click.stop>
                                        <button @click="startEdit">
                                            <i class="fa fa-pencil"></i> Edit
                                        </button>
                                        <button @click="doSave">
                                            <i class="fa fa-bookmark"></i>
                                            {{ saved ? 'Unsave' : 'Save' }}
                                        </button>
                                        <div class="msg-menu-divider"></div>
                                        <button @click="doDelete" class="msg-menu-danger">
                                            <i class="fa fa-trash"></i> Delete
                                        </button>
                                    </div>
                                </Transition>
                            </div>
                            <button class="msg-icon-btn" @click.stop="doReply" title="Reply">
                                <i class="fa fa-reply"></i>
                            </button>
                            <div class="msg-menu-wrap">
                                <button class="msg-icon-btn" @click.stop="toggleReactions" title="React">
                                    <i class="fa-regular fa-face-smile"></i>
                                </button>
                                <Transition name="dropdown">
                                    <div v-if="showReactions" class="reaction-bar" :class="{ 'above': reactionsAbove, 'reaction-bar-right': isOwner }" @click.stop>
                                        <button class="reaction-btn" @click.stop="doReact('❤️')">❤️</button>
                                        <button class="reaction-btn" @click.stop="doReact('😆')">😆</button>
                                        <button class="reaction-btn" @click.stop="doReact('😮')">😮</button>
                                        <button class="reaction-btn" @click.stop="doReact('😢')">😢</button>
                                        <button class="reaction-btn" @click.stop="doReact('😡')">😡</button>
                                        <button class="reaction-btn" @click.stop="doReact('👍')">👍</button>
                                    </div>
                                </Transition>
                            </div>
                        </div>
                    </Transition>
                    <div class="bubble" :class="{ pressing: isPressing }">{{ content }}</div>
                </div>
                <div v-if="groupedReactions.length > 0" class="reaction-display">
                    <button v-for="r in groupedReactions" :key="r.emoji"
                        class="reaction-pill" :class="{ mine: r.mine }"
                        @click.stop="openReactionPopup(r.emoji, $event)">
                        {{ r.emoji }} {{ r.count }}
                    </button>
                </div>
                <span v-if="isEdited" class="edited-label">edited</span>
            </template>
        </div>
    </template>
</div>
