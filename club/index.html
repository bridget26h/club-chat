<div class="chat-pane">
    <h2>{{ clubTitle }}</h2>

    <div class="messages-wrap">
      <p v-if="areMessagesLoading"><em>Loading messages...</em></p>
      <ul v-else>
        <li v-for="msg of sortedMessages" :key="msg.url">
          <strong><graffiti-actor-to-handle :actor="msg.actor"></graffiti-actor-to-handle></strong>:
          {{ msg.value.content }}
          <span class="time">{{ formatTime(msg.value.published) }}</span>
          <button
            v-if="msg.actor === $graffitiSession.value?.actor"
            @click="deleteMessage(msg)"
            :disabled="isDeleting.has(msg.url)"
          >{{ isDeleting.has(msg.url) ? 'Deleting...' : 'Delete' }}</button>
        </li>
        <li v-if="sortedMessages.length === 0">No messages yet.</li>
      </ul>
    </div>

    <form @submit.prevent="sendMessage">
      <input type="text" v-model="myMessage" placeholder="Type a message..." />
      <button type="submit" :disabled="!myMessage || isSending">
        {{ isSending ? 'Sending...' : 'Send' }}
      </button>
    </form>
  </div>
